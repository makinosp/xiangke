name: Rust CI

on:
  push:
    branches: [main, feature/**]
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "justfile"
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "Cargo.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint + test (stable toolchain)
  # ──────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check
        working-directory: rust

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: rust

      - name: Build (native)
        run: cargo build
        working-directory: rust

      - name: Run tests
        run: cargo test
        working-directory: rust

  # ──────────────────────────────────────────────
  # Job 2: WASM cross-compile (nightly + Emscripten)
  # ──────────────────────────────────────────────
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      # Add upstream/bin to PATH for wasm-opt (bundled with emsdk, not system binaryen).
      # System binaryen (via apt) may be older and incompatible with WASM features
      # emitted by the Rust/Emscripten toolchain.
      - name: Add wasm-opt to PATH (emsdk bundled binaryen)
        run: |
          WASM_OPT_DIR="$(dirname "$(which emcc)")/../bin"
          echo "$WASM_OPT_DIR" >> "$GITHUB_PATH"
          wasm-opt --version

      - name: Build WASM (debug)
        run: cargo +nightly build -Zbuild-std --target wasm32-unknown-emscripten
        working-directory: rust

      - name: Check WASM binary size (debug)
        run: |
          WASM=$(find target/wasm32-unknown-emscripten/debug -name "*.wasm" -type f | head -1)
          if [ -n "$WASM" ]; then
            SIZE=$(stat --format=%s "$WASM")
            echo "WASM debug binary: $WASM ($SIZE bytes)"
          else
            echo "No .wasm file found in target/wasm32-unknown-emscripten/debug/"
            ls -la target/wasm32-unknown-emscripten/debug/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi
        working-directory: rust

      - name: Build WASM (release)
        run: cargo +nightly build -Zbuild-std --target wasm32-unknown-emscripten --release
        working-directory: rust

      - name: Optimize WASM binary with wasm-opt
        run: |
          WASM=$(find target/wasm32-unknown-emscripten/release -name "*.wasm" -type f | head -1)
          if [ -n "$WASM" ]; then
            OPT="${WASM%.wasm}.opt.wasm"
            # Enable WASM features emitted by Rust+Emscripten:
            #   bulk-memory:          memory.copy / memory.fill
            #   sign-ext:             i32.extend8_s / i32.extend16_s
            #   saturating-float-to-int: i32.trunc_sat_f64_u
            #   mutable-globals:      Emscripten stack pointer import
            wasm-opt -Oz \
              --enable-bulk-memory \
              --enable-sign-ext \
              --enable-saturating-float-to-int \
              --enable-mutable-globals \
              "$WASM" -o "$OPT"
            mv "$OPT" "$WASM"
            SIZE=$(stat --format=%s "$WASM")
            echo "WASM release binary: $WASM"
            echo "WASM release size (after -Oz): $SIZE bytes (max 5MB = 5242880)"
            if [ "$SIZE" -gt 5242880 ]; then
              echo "::warning::WASM binary size $SIZE exceeds 5MB budget!"
            fi
          else
            echo "No .wasm file found in target/wasm32-unknown-emscripten/release/"
            ls -la target/wasm32-unknown-emscripten/release/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi
        working-directory: rust
